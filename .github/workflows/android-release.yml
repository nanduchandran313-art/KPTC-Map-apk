name: Build & Publish KPTC Kuwait APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-apk:
    name: Build Debug APK & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK & accept licenses
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Restore debug keystore from base64
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Assemble installable Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare release APK asset
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk KPTC-Kuwait.apk
          ls -lh KPTC-Kuwait.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KPTC-Kuwait-debug-apk
          path: KPTC-Kuwait.apk

      - name: Publish GitHub Release with direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: KPTC Kuwait ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          body: |
            Automated debug APK build for **KPTC Kuwait**.

            **Permanent Direct APK Download:**
            `https://github.com/${{ github.repository }}/releases/latest/download/KPTC-Kuwait.apk`
          make_latest: true
          files: |
            KPTC-Kuwait.apk
